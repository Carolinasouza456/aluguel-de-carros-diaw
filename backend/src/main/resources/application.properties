spring.application.name=aluguel-de-carros

# conexao com o supabase (postgresql). os valores vem de variaveis de ambiente
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# as tabelas sao criadas pelo arquivo database/schema.sql, o hibernate so confere
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# endereco do front-end liberado no cors
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# cria agentes e automoveis de exemplo se o banco estiver vazio
app.dados-iniciais=${DADOS_INICIAIS:true}
